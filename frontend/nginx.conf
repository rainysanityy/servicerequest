# nginx-unprivileged (UID 101) – liefert ausschließlich statische SPA-Dateien.
# TLS, CSP & Rate Limits setzt der vorgelagerte Reverse Proxy.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  access_log /dev/stdout;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1k;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Gehashte Build-Assets: lange cachen
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location = /config.json {
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    # SPA-Fallback; nur GET/HEAD
    location / {
      limit_except GET HEAD { deny all; }
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }

    # Versteckte Dateien nie ausliefern
    location ~ /\. { deny all; }
  }
}
