name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend – Typecheck, Tests, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts --no-audit; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Abhängigkeiten prüfen (npm audit)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend:
    name: Frontend – Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts --no-audit; fi
      - run: npm run build
      - name: Abhängigkeiten prüfen (npm audit)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  database:
    name: Datenbank – Migrationen gegen PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      PGDATABASE: portal
    steps:
      - uses: actions/checkout@v4
      - name: Rollen anlegen (db/init)
        run: |
          mkdir -p /tmp/secrets && echo migpw > /tmp/secrets/m && echo apppw > /tmp/secrets/a
          sed 's#/run/secrets/portal_migrator_db_password#/tmp/secrets/m#; s#/run/secrets/portal_app_db_password#/tmp/secrets/a#' \
            db/init/01-roles.sh > /tmp/init.sh
          POSTGRES_USER=postgres POSTGRES_DB=portal sh /tmp/init.sh
      - name: Migrationen als portal_migrator
        run: |
          for f in backend/migrations/*.sql; do
            PGUSER=portal_migrator PGPASSWORD=migpw psql -v ON_ERROR_STOP=1 --single-transaction -q -f "$f"
          done
      - name: Rechte der App-Rolle prüfen
        run: |
          export PGUSER=portal_app PGPASSWORD=apppw
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM catalog_items"
          psql -v ON_ERROR_STOP=1 -c "SELECT * FROM apply_retention(30, 30, 7)"
          if psql -c "DELETE FROM audit_log" 2>/dev/null; then echo "audit_log darf nicht löschbar sein"; exit 1; fi
          if psql -c "DROP TABLE tickets" 2>/dev/null; then echo "App-Rolle darf kein DDL"; exit 1; fi
      - name: Demo-Daten laden (idempotent) und Hash-Kette prüfen
        run: |
          psql -v ON_ERROR_STOP=1 -q -f scripts/demo-data.sql
          psql -v ON_ERROR_STOP=1 -q -f scripts/demo-data.sql
          test "$(psql -tAc "SELECT count(*) FROM portal.tickets")" -gt 1500
          psql -v ON_ERROR_STOP=1 -tAc "
            SELECT count(*) FROM (
              SELECT id, row_hash, prev_hash, lag(row_hash) OVER (ORDER BY id) AS lag_hash FROM portal.audit_log) x
            WHERE prev_hash <> coalesce(lag_hash, 'GENESIS')" | grep -qx 0

  keycloak:
    name: Keycloak – Realm-Import, Registrierung, Admin-API
    runs-on: ubuntu-latest
    env:
      KC: http://localhost:8080/auth
      SECRET: ci-secret-0123456789abcdefABCDEF
    steps:
      - uses: actions/checkout@v4
      - name: Keycloak mit Realm-Import starten
        run: |
          # Test ohne TLS: Kopie des Realms mit sslRequired=external (Produktion: "all" hinter dem TLS-Proxy)
          mkdir -p /tmp/kcimport && chmod 755 /tmp/kcimport
          jq '.sslRequired = "external"' keycloak/import/itportal-realm.json > /tmp/kcimport/itportal-realm.json
          chmod 644 /tmp/kcimport/itportal-realm.json
          docker run -d --name kc -p 8080:8080 \
            -v "/tmp/kcimport:/opt/keycloak/data/import:ro" -v "$PWD/keycloak/themes/itportal:/opt/keycloak/themes/itportal:ro" \
            -e KC_HTTP_RELATIVE_PATH=/auth -e KC_HEALTH_ENABLED=true \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=bootstrap -e KC_BOOTSTRAP_ADMIN_PASSWORD=bootstrap \
            -e PORTAL_HOSTNAME=localhost -e KEYCLOAK_ADMIN_API_SECRET="$SECRET" \
            quay.io/keycloak/keycloak:26.4 start-dev --import-realm
          for i in $(seq 1 90); do
            curl -sf "$KC/realms/itportal/.well-known/openid-configuration" >/dev/null && break; sleep 2
          done
          curl -sf "$KC/realms/itportal/.well-known/openid-configuration" >/dev/null || { docker logs kc | tail -80; exit 1; }
      - name: Registrierungsseite erreichbar (PKCE erforderlich)
        run: |
          CH=E9Melhoe2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
          U="$KC/realms/itportal/protocol/openid-connect/registrations?client_id=portal-frontend&response_type=code&scope=openid&redirect_uri=https%3A%2F%2Flocalhost%2F"
          code=$(curl -s -o page.html -w '%{http_code}' "$U&code_challenge=$CH&code_challenge_method=S256")
          echo "HTTP $code"; test "$code" = 200 || { head -c 2000 page.html; exit 1; }
          grep -qi 'kc-register-form\|registration' page.html
          grep -q 'login/itportal/css/itportal.css' page.html || { echo 'Theme itportal nicht aktiv'; exit 1; }
          # ohne PKCE muss die Anfrage abgelehnt werden
          code=$(curl -s -o /dev/null -w '%{http_code}' "$U")
          echo "ohne PKCE: HTTP $code"; test "$code" != 200 -o -n "$(curl -s "$U" | grep -i 'code_challenge')"
      - name: Admin-API über Service-Account (wie das Backend)
        run: |
          set -e
          TOKEN=$(curl -sf -d grant_type=client_credentials -d client_id=portal-admin-api -d "client_secret=$SECRET" \
            "$KC/realms/itportal/protocol/openid-connect/token" | jq -r .access_token)
          H="Authorization: Bearer $TOKEN"; A="$KC/admin/realms/itportal"
          curl -sf -H "$H" "$A/users?max=5&briefRepresentation=true" >/dev/null
          curl -sf -H "$H" "$A/users/count" >/dev/null
          UHD=$(curl -sf -H "$H" "$A/group-by-path/IT-UHD" | jq -r .id)
          # Benutzer anlegen, Standardgruppe prüfen, Rolle UHD vergeben/entziehen, sperren
          curl -sf -H "$H" -H 'Content-Type: application/json' -X POST "$A/users" \
            -d '{"username":"ci.user","email":"ci.user@example.com","firstName":"CI","lastName":"User","enabled":true}'
          ID=$(curl -sf -H "$H" "$A/users?username=ci.user&exact=true" | jq -r '.[0].id')
          curl -sf -H "$H" "$A/users/$ID/groups" | jq -e 'map(.path) | index("/Mitarbeitende")' >/dev/null
          curl -sf -H "$H" -X PUT "$A/users/$ID/groups/$UHD"
          curl -sf -H "$H" "$A/groups/$UHD/members?briefRepresentation=true" | jq -e --arg id "$ID" 'map(.id) | index($id)' >/dev/null
          curl -sf -H "$H" -X DELETE "$A/users/$ID/groups/$UHD"
          curl -sf -H "$H" -H 'Content-Type: application/json' -X PUT "$A/users/$ID" -d '{"enabled":false}'
          curl -sf -H "$H" "$A/users/$ID" | jq -e '.enabled == false' >/dev/null
          curl -sf -H "$H" -X POST "$A/users/$ID/logout"
          echo "Admin-API-Prüfungen erfolgreich"
      - name: Standard-Client-Scopes und Audience für portal-frontend
        run: |
          TOKEN=$(curl -sf -d grant_type=client_credentials -d client_id=portal-admin-api -d "client_secret=$SECRET" \
            "$KC/realms/itportal/protocol/openid-connect/token" | jq -r .access_token)
          A="$KC/admin/realms/itportal"
          ADM=$(curl -sf -d grant_type=password -d client_id=admin-cli -d username=bootstrap -d password=bootstrap \
            "$KC/realms/master/protocol/openid-connect/token" | jq -r .access_token)
          CID=$(curl -sf -H "Authorization: Bearer $ADM" "$A/clients?clientId=portal-frontend" | jq -r '.[0].id')
          curl -sf -H "Authorization: Bearer $ADM" "$A/clients/$CID/default-client-scopes" | jq -e 'map(.name) | (index("roles") and index("profile") and index("email"))' >/dev/null
          curl -sf -H "Authorization: Bearer $ADM" "$A/clients/$CID/protocol-mappers/models" | jq -e 'map(.config["included.client.audience"]) | index("portal-api")' >/dev/null
          curl -sf -H "Authorization: Bearer $ADM" "$A" | jq -e '.registrationAllowed == true and .verifyEmail == false and .resetPasswordAllowed == false' >/dev/null
          curl -sf -H "Authorization: Bearer $ADM" "$A/default-groups" | jq -e 'map(.path) | index("/Mitarbeitende")' >/dev/null
          echo "Realm-Konfiguration korrekt"
      - name: Service-Account darf nicht in den Master-Realm
        run: |
          TOKEN=$(curl -sf -d grant_type=client_credentials -d client_id=portal-admin-api -d "client_secret=$SECRET" \
            "$KC/realms/itportal/protocol/openid-connect/token" | jq -r .access_token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$KC/admin/realms/master/users")
          test "$code" = 401 -o "$code" = 403
      - name: MFA-Pflicht und erstes Admin-Konto (scripts/keycloak-setup.mjs, zweimal = idempotent)
        run: |
          export KC_URL=$KC KC_ADMIN_USER=bootstrap KC_ADMIN_PASSWORD=bootstrap
          FIRST_ADMIN_USERNAME=ci.portaladmin FIRST_ADMIN_EMAIL=ci.portaladmin@example.com node scripts/keycloak-setup.mjs
          FIRST_ADMIN_USERNAME=ci.portaladmin FIRST_ADMIN_EMAIL=ci.portaladmin@example.com node scripts/keycloak-setup.mjs
          ADM=$(curl -sf -d grant_type=password -d client_id=admin-cli -d username=bootstrap -d password=bootstrap \
            "$KC/realms/master/protocol/openid-connect/token" | jq -r .access_token)
          A="$KC/admin/realms/itportal"; H="Authorization: Bearer $ADM"
          curl -sf -H "$H" "$A" | jq -e '.browserFlow == "browser-mfa"' >/dev/null
          curl -sf -H "$H" "$A/authentication/flows/browser-mfa/executions" | tee /tmp/flow.json | jq -r '.[] | "\(.level) \(.requirement) \(.displayName)"'
          test "$(jq '[.[] | select(.displayName == "browser-mfa MFA-Pflicht")] | length' /tmp/flow.json)" = 1
          test "$(jq '[.[] | select(.providerId == "conditional-user-role")] | length' /tmp/flow.json)" = 2
          ID=$(curl -sf -H "$H" "$A/users?username=ci.portaladmin&exact=true" | jq -r '.[0].id')
          curl -sf -H "$H" "$A/users/$ID/groups" | jq -e 'map(.path) | index("/IT-Portal-Admins")' >/dev/null
          # Testkonten: normaler Nutzer und UHD (ohne eingerichtetes OTP)
          for u in ci.mfa.user ci.mfa.uhd; do
            curl -sf -H "$H" -H 'Content-Type: application/json' -X POST "$A/users" -d "{\"username\":\"$u\",\"email\":\"$u@example.com\",\"emailVerified\":true,\"firstName\":\"CI\",\"lastName\":\"Test\",\"enabled\":true,\"credentials\":[{\"type\":\"password\",\"value\":\"Ci-Test-Pass-2026!\",\"temporary\":false}]}"
          done
          UHDG=$(curl -sf -H "$H" "$A/group-by-path/IT-UHD" | jq -r .id)
          UID2=$(curl -sf -H "$H" "$A/users?username=ci.mfa.uhd&exact=true" | jq -r '.[0].id')
          curl -sf -H "$H" -X PUT "$A/users/$UID2/groups/$UHDG"
      - name: Login-Ablauf – Nutzer ohne 2FA, UHD muss TOTP einrichten
        run: |
          CH=E9Melhoe2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
          login() {
            jar=$(mktemp)
            U="$KC/realms/itportal/protocol/openid-connect/auth?client_id=portal-frontend&response_type=code&scope=openid&redirect_uri=https%3A%2F%2Flocalhost%2F&state=ci&code_challenge=$CH&code_challenge_method=S256"
            action=$(curl -s -c "$jar" -b "$jar" "$U" | tr '\n' ' ' | grep -o 'id="kc-form-login"[^>]*action="[^"]*"' | sed 's/.*action="//; s/"$//; s/&amp;/\&/g')
            test -n "$action" || { echo "Login-Formular nicht gefunden"; return 1; }
            curl -s -c "$jar" -b "$jar" -o /tmp/after.html -w '%{http_code} %{redirect_url}' \
              --data-urlencode "username=$1" --data-urlencode "password=Ci-Test-Pass-2026!" -d credentialId= "$action"
          }
          r=$(login ci.mfa.user); echo "Nutzer: $r"
          [[ "$r" == 302\ https://localhost/* && "$r" == *code=* ]] || { head -c 1500 /tmp/after.html; exit 1; }
          r=$(login ci.mfa.uhd); echo "UHD: $r"
          # Keycloak leitet zur Pflichtaktion "TOTP einrichten" weiter (kein Code für die Anwendung)
          [[ "$r" == *required-action*CONFIGURE_TOTP* || ( "$r" == 200* && $(grep -ci totp /tmp/after.html) -gt 0 ) ]] \
            || { head -c 1500 /tmp/after.html; exit 1; }
          echo "MFA-Pflicht greift nur für privilegierte Konten"
      - name: Logs bei Fehler
        if: failure()
        run: docker logs kc | tail -120

  config:
    name: Konfiguration & Skripte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose-Datei validieren
        run: |
          cp .env.example .env
          mkdir -p secrets && for s in postgres_superuser_password portal_migrator_db_password portal_app_db_password; do echo x > secrets/$s; done
          docker compose config -q
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh fedora-hardening/scripts/*.sh db/init/*.sh
          shellcheck -s sh -S warning proxy/entrypoint/*.sh
      - name: JSON prüfen
        run: for f in keycloak/import/*.json keycloak/demo-users/*.json frontend/public/config.json fedora-hardening/files/docker/daemon.json; do jq empty "$f"; done

  images:
    name: Container-Images bauen
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Images bauen
        run: |
          for c in backend frontend proxy keycloak; do
            docker build -t srp/$c:ci ./$c
          done
      - name: Schwachstellenscan (Trivy)
        run: |
          for c in backend frontend proxy keycloak; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
              image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 --no-progress srp/$c:ci
          done

  e2e:
    name: E2E – Produktiv-Installation, Zertifikatstausch, Backup/Restore
    runs-on: ubuntu-latest
    needs: [backend, frontend, keycloak]
    timeout-minutes: 45
    env:
      H: portal.ci.test
      P: "8443"
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge, Test-PKI (Root → Issuing → Server), age-Schlüssel
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age jq
          mkdir -p /tmp/pki && cd /tmp/pki
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:secp384r1 -nodes -keyout ca.key -out ca.crt -days 365 -subj "/CN=CI Root CA/O=CI" 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:secp384r1 -nodes -keyout int.key -out int.csr -subj "/CN=CI Issuing CA/O=CI" 2>/dev/null
          printf 'basicConstraints=critical,CA:true,pathlen:0\nkeyUsage=critical,keyCertSign,cRLSign\n' > int.ext
          openssl x509 -req -in int.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out int.crt -days 365 -sha384 -extfile int.ext 2>/dev/null
          printf 'subjectAltName=DNS:%s\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:false\n' "$H" > leaf.ext
          for n in a b; do
            openssl req -newkey ec -pkeyopt ec_paramgen_curve:secp384r1 -nodes -keyout $n.key -out $n.csr -subj "/CN=$H/O=CI $n" 2>/dev/null
            openssl x509 -req -in $n.csr -CA int.crt -CAkey int.key -CAcreateserial -out $n.crt -days 90 -sha384 -extfile leaf.ext 2>/dev/null
            cat $n.crt int.crt > $n.fullchain.crt
          done
          openssl pkcs12 -export -in b.crt -inkey b.key -certfile int.crt -out b.p12 -passout pass:CiP12pass 2>/dev/null
          age-keygen -o /tmp/backup.key 2>/dev/null
          age-keygen -y /tmp/backup.key > /tmp/backup.pub
          sudo install -d -o "$USER" -m 0700 /srv/backup/srp
      - name: prod-setup.sh (unbeaufsichtigt, wie auf dem Server)
        run: |
          NONINTERACTIVE=1 PORTAL_HOSTNAME=$H ALLOWED_EMAIL_DOMAINS=firma.de ADMIN_ALLOW_CIDR=10.10.0.0/24 \
          BACKUP_AGE_RECIPIENT="$(cat /tmp/backup.pub)" CERT_FILE=/tmp/pki/a.fullchain.crt KEY_FILE=/tmp/pki/a.key \
          FIRST_ADMIN_USERNAME=max.admin FIRST_ADMIN_EMAIL=max.admin@firma.de FIRST_ADMIN_FIRSTNAME=Max FIRST_ADMIN_LASTNAME=Admin \
          SUPPORT_PHONE="+49 30 9999-0" SUPPORT_HOURS="Mo–Fr 7–18 Uhr" \
            ./scripts/prod-setup.sh 2>&1 | tee /tmp/setup.log
          grep -q 'Zwei-Faktor-Pflicht aktiv' /tmp/setup.log
          grep -q 'Portal-Admin "max.admin"' /tmp/setup.log
          grep -q 'Temporäres Passwort' /tmp/setup.log
      - name: Go-Live-Prüfung (nur Plattform-Warnungen erlaubt)
        run: ./scripts/prod-preflight.sh
      - name: Abnahme über den Proxy
        run: |
          C=(curl -sk --resolve "$H:$P:127.0.0.1")
          test "$("${C[@]}" -o /dev/null -w '%{http_code}' "https://$H:$P/")" = 200
          test "$("${C[@]}" -o /dev/null -w '%{http_code}' "https://$H:$P/api/me")" = 401
          test "$("${C[@]}" "https://$H:$P/config.json" | jq -r .supportPhone)" = "+49 30 9999-0"
          # Admin-Konsole nur aus dem Admin-Netz (Runner ist nicht im Netz 10.10.0.0/24)
          test "$("${C[@]}" -o /dev/null -w '%{http_code}' "https://$H:$P/auth/admin/")" = 403
          test "$("${C[@]}" -o /dev/null -w '%{http_code}' "https://$H:$P/auth/realms/master/.well-known/openid-configuration")" = 403
          # Zertifikatskette wird vollständig ausgeliefert und ist gegen die Test-Root gültig
          echo | openssl s_client -connect 127.0.0.1:$P -servername $H -CAfile /tmp/pki/ca.crt 2>/dev/null | grep -q 'Verify return code: 0'
          # Upload-Endpunkt existiert und ist geschützt
          test "$("${C[@]}" -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "https://$H:$P/api/admin/tls")" = 401
      - name: Zertifikatstausch über das Volume (wie nach Upload in der Admin-Oberfläche)
        run: |
          fp() { echo | openssl s_client -connect 127.0.0.1:$P -servername $H 2>/dev/null | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2; }
          want=$(openssl x509 -in /tmp/pki/b.crt -noout -fingerprint -sha256 | cut -d= -f2)
          before=$(fp); test "$before" != "$want"
          cid=$(docker compose ps -q backend)
          # p12 mit dem Backend-Parser prüfen und als PEM ablegen – exakt der Code der Admin-API
          docker compose exec -T -e P12B64="$(base64 -w0 /tmp/pki/b.p12)" -e H="$H" backend /nodejs/bin/node --input-type=module -e "
            const { parsePkcs12, checkServerCertificate } = await import('/app/dist/pkcs12.js');
            const { writeFileSync, renameSync } = await import('node:fs');
            const r = checkServerCertificate(parsePkcs12(Buffer.from(process.env.P12B64, 'base64'), 'CiP12pass'), process.env.H);
            if (!r.ok) { console.error(r.errors); process.exit(1); }
            writeFileSync('/tls/.k', r.keyPem, { mode: 0o644 }); renameSync('/tls/.k', '/tls/tls.key');
            writeFileSync('/tls/.c', r.certPem, { mode: 0o644 }); renameSync('/tls/.c', '/tls/tls.crt');
            writeFileSync('/tls/meta.json', JSON.stringify({ fingerprint256: r.info.fingerprint256, uploadedAt: new Date().toISOString(), uploadedBy: 'ci', info: r.info }));
            console.log('abgelegt', r.info.fingerprint256);"
          for i in $(seq 1 20); do [ "$(fp)" = "$want" ] && break; sleep 3; done
          test "$(fp)" = "$want"
          docker compose logs proxy | grep 'tls: Zertifikat gewechselt'
          # Ungültiges Zertifikat (passt nicht zum Schlüssel) darf den Proxy nicht stören
          docker compose exec -T backend /nodejs/bin/node --input-type=module -e "
            const fs = await import('node:fs');
            fs.writeFileSync('/tls/tls.crt', fs.readFileSync('/dev/stdin'));
            fs.writeFileSync('/tls/meta.json', JSON.stringify({ fingerprint256: 'kaputt' }));" < /tmp/pki/a.crt
          sleep 25
          test "$(fp)" = "$want"
          docker compose logs proxy | grep -q 'ist ungültig (nginx -t)'
          # Neustart: Proxy startet trotz kaputtem Upload mit dem Server-Zertifikat
          docker compose restart proxy
          for i in $(seq 1 30); do curl -sk --resolve "$H:$P:127.0.0.1" -o /dev/null "https://$H:$P/healthz" && break; sleep 2; done
          test "$(fp)" = "$before"
      - name: Backup, Wiederherstellung, Update-Skript
        run: |
          set -a; . ./.env; set +a
          PW=$(cat secrets/postgres_superuser_password)
          psql() { docker compose exec -T -e PGPASSWORD="$PW" db psql -U postgres -d portal -tAc "$1"; }
          ./scripts/backup.sh
          B=$(ls -d /srv/backup/srp/*/ | tail -1)
          ls -l "$B"; test -s "$B/portal.dump.age"; test -s "$B/keycloak.dump.age"; test -s "$B/tls.tar.age"
          (cd "$B" && sha256sum -c SHA256SUMS)
          age -d -i /tmp/backup.key "$B/portal.dump.age" | head -c 5 | grep -q PGDMP
          # Änderung nach dem Backup → muss durch Restore verschwinden
          psql "INSERT INTO portal.categories (id, name) VALUES ('ci-marker', 'CI-Marker')"
          test "$(psql "SELECT count(*) FROM portal.categories WHERE id='ci-marker'")" = 1
          echo RESTORE | ./scripts/restore.sh "$B" /tmp/backup.key
          for i in $(seq 1 60); do curl -sk --resolve "$H:$P:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$H:$P/auth/realms/itportal/.well-known/openid-configuration" | grep -q 200 && break; sleep 5; done
          test "$(psql "SELECT count(*) FROM portal.categories WHERE id='ci-marker'")" = 0
          PROXY_HTTPS_PORT=$P ./scripts/smoke-test.sh
          # Audit-Hash-Kette nach Restore intakt
          test "$(psql "SELECT count(*) FROM (SELECT prev_hash, lag(row_hash) OVER (ORDER BY id) AS l FROM portal.audit_log) x WHERE prev_hash <> coalesce(l,'GENESIS')")" = 0
          # Update aus Verzeichnis (gleiche Version) – Ablauf inkl. Backup, Build, Smoke-Test
          git config --global --add safe.directory "$PWD"
          cp -r "$PWD" /tmp/src && ./scripts/update.sh /tmp/src
      - name: Logs bei Fehler
        if: failure()
        run: docker compose ps -a; docker compose logs --tail=150

