name: Screenshots

# Erzeugt die UI-Screenshots für die README (Playwright, simulierte Keycloak/API-Daten).
# Manuell starten: Actions → Screenshots → Run workflow.
# Ergebnis: Artefakt "screenshots" + Branch "screenshots-update" (zur Prüfung/Übernahme per Merge).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Schriften (Roboto) installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-roboto fonts-roboto-unhinted
      - name: Abhängigkeiten
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts --no-audit; fi
          npm install --no-save --ignore-scripts playwright@1
          npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Keycloak für Registrierungsseite starten
        working-directory: .
        run: |
          mkdir -p /tmp/kcimport && chmod 755 /tmp/kcimport
          jq '.sslRequired = "external"' keycloak/import/itportal-realm.json > /tmp/kcimport/itportal-realm.json
          chmod 644 /tmp/kcimport/itportal-realm.json
          docker run -d --name kc -p 8080:8080 -v /tmp/kcimport:/opt/keycloak/data/import:ro -v "$PWD/keycloak/themes/itportal:/opt/keycloak/themes/itportal:ro" \
            -e KC_HTTP_RELATIVE_PATH=/auth -e PORTAL_HOSTNAME=localhost -e KEYCLOAK_ADMIN_API_SECRET=screenshot-only-secret-0123456789 \
            quay.io/keycloak/keycloak:26.4 start-dev --import-realm
          for i in $(seq 1 90); do curl -sf http://localhost:8080/auth/realms/itportal/.well-known/openid-configuration >/dev/null && break; sleep 2; done
      - name: Screenshots aufnehmen
        run: |
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on http://localhost:4173 -t 60000
          KC_URL=http://localhost:8080/auth node screenshots/capture.mjs http://localhost:4173 ../docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
          retention-days: 7
      - name: In Branch screenshots-update committen
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B screenshots-update
          git add docs/screenshots/*.png
          git commit -m "docs: UI-Screenshots aktualisiert" || exit 0
          git push -f origin screenshots-update
