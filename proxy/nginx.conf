# =============================================================================
#  Reverse Proxy – TLS-Terminierung, Security-Header, Rate Limiting
#  Image: nginx-unprivileged (UID 101), read-only rootfs
# =============================================================================
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  client_max_body_size 256k;
  large_client_header_buffers 4 16k;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Strukturierte JSON-Zugriffslogs (SIEM-tauglich, ohne Query-Strings/Token)
  log_format json escape=json '{"ts":"$time_iso8601","req_id":"$request_id","remote":"$remote_addr",'
                              '"method":"$request_method","path":"$uri","status":$status,'
                              '"bytes":$body_bytes_sent,"rt":$request_time,"upstream":"$upstream_addr",'
                              '"ua":"$http_user_agent"}';
  access_log /dev/stdout json;

  # ---- Rate Limiting (NIST SC-5 / BSI APP.3.2) -------------------------------
  limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone  $binary_remote_addr zone=web:10m   rate=50r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # ---- TLS gemäß BSI TR-02102-2 ----------------------------------------------
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
  ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
  ssl_ecdh_curve secp384r1:prime256v1;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;
  ssl_session_tickets off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Request-ID: immer von nginx erzeugt ($request_id), nie vom Client übernommen
  # -> End-to-End-Korrelation Proxy -> API -> Audit-Log

  include /etc/nginx/conf.d/*.conf;
}
