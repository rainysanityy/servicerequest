<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>$title$</title>
<style>
  @page { size: A4; margin: 0; }
  html, body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-print-color-adjust: exact; }
  .page { position: relative; width: 210mm; height: 296mm; overflow: hidden; background: #FEF7FF; }
  .blob1 { position: absolute; right: -170px; top: -170px; width: 640px; }
  .blob2 { position: absolute; left: -120px; bottom: 120px; width: 380px; }
  .band { position: absolute; left: 60px; right: 60px; top: 300px; padding: 46px 52px; border-radius: 48px; background: #EADDFF; }
  .kicker { font-size: 17px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #6750A4; }
  h1 { font-size: 58px; line-height: 1.08; margin: 14px 0 12px; color: #21005D; font-weight: 600; letter-spacing: -1px; }
  .sub { font-size: 22px; color: #4A4458; }
  .meta { position: absolute; left: 60px; right: 60px; bottom: 90px; }
  table { border-collapse: collapse; font-size: 16px; color: #1D1B20; }
  td { padding: 7px 28px 7px 0; }
  td.k { color: #625B71; }
  .chip { display: inline-block; padding: 6px 16px; border-radius: 18px; background: #FFD8E4; color: #31111D; font-weight: 600; font-size: 14px; }
</style></head>
<body><div class="page">
  <svg class="blob1" viewBox="0 0 1 1"><polygon fill="#D0BCFF" points="$blob1$"/></svg>
  <svg class="blob2" viewBox="0 0 1 1"><polygon fill="#FFD8E4" points="$blob2$"/></svg>
  <div class="band">
    <div class="kicker">IT-Service-Request-Portal</div>
    <h1>$title$</h1>
    <div class="sub">$subtitle$</div>
  </div>
  <div class="meta">
    <span class="chip">Klassifizierung: $classification$</span>
    <table style="margin-top:22px">
      <tr><td class="k">Version</td><td>$version$</td></tr>
      <tr><td class="k">Stand</td><td>$date$</td></tr>
      <tr><td class="k">Zielgruppe</td><td>$audience$</td></tr>
      <tr><td class="k">Gültig für</td><td>Portal-Release 1.0.0 · Keycloak 26 · Fedora Server ≥ 41</td></tr>
    </table>
  </div>
</div></body></html>
