# =============================================================================
# SSH-Härtung gemäß BSI IT-Grundschutz (SYS.1.3, OPS.1.2.5) und
# BSI TR-02102-4 (Verwendung von Secure Shell). Datei 00-* hat Vorrang vor
# 50-redhat.conf (OpenSSH: erster gefundener Wert gilt).
# =============================================================================
Port 22
AddressFamily any

# --- Authentisierung: nur Public Key, kein Root ---------------------------
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
HostbasedAuthentication no
IgnoreRhosts yes
GSSAPIAuthentication no
UsePAM yes
AllowGroups sshusers
StrictModes yes
MaxAuthTries 3
MaxSessions 4
MaxStartups 10:30:60
LoginGraceTime 30

# --- Sitzungen ------------------------------------------------------------
ClientAliveInterval 300
ClientAliveCountMax 2
TCPKeepAlive no

# --- Funktionen deaktivieren (Least Functionality) ------------------------
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
PermitUserRC no
DisableForwarding yes
Compression no

# --- Kryptografie (TR-02102-4) -------------------------------------------
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_rsa_key
HostKey /etc/ssh/ssh_host_ed25519_key
# Optional ab OpenSSH 9.9 zusätzlich voranstellen: mlkem768x25519-sha256 (PQ-hybrid)
KexAlgorithms sntrup761x25519-sha512@openssh.com,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group18-sha512,diffie-hellman-group16-sha512
Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
HostKeyAlgorithms ecdsa-sha2-nistp384,ecdsa-sha2-nistp256,rsa-sha2-512,rsa-sha2-256,ssh-ed25519
PubkeyAcceptedAlgorithms ecdsa-sha2-nistp384,ecdsa-sha2-nistp256,rsa-sha2-512,rsa-sha2-256,ssh-ed25519,sk-ecdsa-sha2-nistp256@openssh.com,sk-ssh-ed25519@openssh.com
RequiredRSASize 3072

# --- Protokollierung & Hinweis -------------------------------------------
LogLevel VERBOSE
SyslogFacility AUTHPRIV
Banner /etc/issue.net
PrintMotd no
PrintLastLog yes
