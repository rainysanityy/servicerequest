# ~/.config/systemd/user/docker.service.d/override.conf (Benutzer srp)
# slirp4netns-Porttreiber: erhält die echte Client-IP (wichtig für Rate Limiting,
# ADMIN_ALLOW_CIDR und Audit-Log). Alternativ ab Docker 28: pasta.
[Service]
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_NET=slirp4netns"
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_PORT_DRIVER=slirp4netns"
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_SLIRP4NETNS_SANDBOX=true"
Environment="DOCKERD_ROOTLESS_ROOTLESSKIT_SLIRP4NETNS_SECCOMP=true"
