# journald – persistente, versiegelte Protokolle mit begrenzter Aufbewahrung
[Journal]
Storage=persistent
Compress=yes
Seal=yes
SplitMode=uid
SystemMaxUse=4G
SystemKeepFree=2G
MaxFileSec=1week
# Datenschutz: Aufbewahrung begrenzen (siehe Datenschutzkonzept, Kap. Löschfristen)
MaxRetentionSec=180day
RateLimitIntervalSec=30s
RateLimitBurst=10000
ForwardToSyslog=no
