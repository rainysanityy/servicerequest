# Automatische Sicherheitsupdates (BSI OPS.1.1.3 Patch- und Änderungsmanagement)
[commands]
upgrade_type = security
random_sleep = 900
network_online_timeout = 120
download_updates = yes
apply_updates = yes
# Neustart nur wenn nötig (Kernel, glibc …) im Wartungsfenster des Timers
reboot = when-needed
reboot_command = "shutdown -r +10 'Neustart nach Sicherheitsupdates'"

[emitters]
emit_via = stdio

[base]
debuglevel = 1
